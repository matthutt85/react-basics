<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>React Basics</title>
</head>
<body>

 <div class="js-container"></div>

    <!--The script tags below load the react library-->
    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <!--The script below runs the react dom - this loads features specifc for websites, if developing for mobile apps you would load react and reactNative-->
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
    <!--The script below loads the Babel library, this allows react code to be compiled in Javascript, as websites cant read JSX, only JS-->
    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">

        // below is a function that we call a component
        // the below <> is called a fragment, it is a container without using a div
        const ChatBot = () => {
            return (
                <>
                    <input type="text" Placeholder = "Send a message to ChatBot" size="30" />
                    <button>Send</button>
                </>
            )
        }

        //Chat from the user to the bot. component will need a text box and a profile image
        // props is an object - it contains ill the attributes we give to <ChatMessage /> e.g. props = {message: "hello chatbot"}

        const ChatMessage = (props) => {
            // create a variable to store the value of the props attributes in
            const message = props.message;
            const image = props.image;
            const imageWidth = props.imageWidth

            return (
                <div>
                    {message}
                    <img src={props.image} width={imageWidth}/>
                </div>
            )
        }

        // we than load our companent from above into our rendered element with <ChatInput />
        const App = (
            <>
                <ChatBot />
                <ChatMessage message="hello chatbot" image="robot_image.png" imageWidth="50" />
                <ChatMessage message="Hello! How can I help you?" image="user_image.png" imageWidth="50" />
                <ChatMessage message="can you get me todays date?" image="robot_image.png" imageWidth="50" />
                <ChatMessage message="Today is September 27" image="user_image.png" imageWidth="50" />
            </>
        )
     // how to target elements with js for react
     // grab the element you want to display
     const container = document.querySelector(".js-container");
     // render this on the website in the react dom
     ReactDOM.createRoot(container).render(App);
     // the above code takes the container variable which contains the div element - js container and populates it with Welcome to react 
    </script>
    
</body>
</html>
